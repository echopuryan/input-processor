events {
    worker_connections 1024;
}

http {
    # Rate Limiting
    limit_req_zone $remote_user zone=per_user:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=5r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;

        # Basic Auth
        auth_basic           "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Frontend
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend API
        location /api/ {
            limit_req zone=per_user burst=20 nodelay;
            limit_req zone=per_ip burst=10 nodelay;

            proxy_pass http://api:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-User $remote_user;
        }

        # Auth info endpoint
        location = /auth/me {
            default_type application/json;
            return 200 '{"username":"$remote_user"}';
        }

        # Health check (no auth)
        location = /health {
            auth_basic off;
            return 200 '{"status":"ok"}';
            default_type application/json;
        }
    }
}